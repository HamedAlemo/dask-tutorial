[workspace]
authors = ["HamedAlemo <h.alemohammad@gmail.com>"]
channels = ["conda-forge"]
name = "dask-tutorial"
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]
version = "0.1.0"
description = "Introduction to Dask and tutorials on Dask arrays, dataframes and stackstac"

[tasks]
lab = "jupyter lab"

[dependencies]
python = "3.13.*"
pystac-client = "0.8.5.*"
stackstac = "0.5.1.*"
jupyterlab = ">=4.6.4,<5"
planetary-computer = ">=1.0.0,<2"
leafmap = ">=0.63.1,<0.64"
matplotlib = ">=3.11.2,<4"
dask = ">=2026.8.0,<2027"
dask-labextension = ">=7.0.0,<8"
distributed = ">=2026.8.0,<2027"
ipycytoscape = ">=1.3.3,<2"
bottleneck = ">=1.6.0,<2"
boto3 = ">=1.43.107,<2"
pillow = ">=12.3.0,<13"
xarray = ">=2026.9.0,<2027"

[pypi-dependencies]
geogif = "==0.3"

[pypi-options]
# geogif 0.3 caps numpy<2 and Pillow<11, which are incompatible with Python 3.13.
# geogif is pure Python and works with the newer versions, so relax those caps.
dependency-overrides = { numpy = ">=2", pillow = ">=10.1" }
